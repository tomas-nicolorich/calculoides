installed:
- agent-context
- bugfix
- superb
- version-guard
settings:
  auto_execute_hooks: true
hooks:
  before_plan:
  - extension: version-guard
    command: speckit.version-guard.check
    enabled: true
    optional: false
    description: Verify tech stack versions and write constraints before planning
    condition: null
  before_implement:
  - extension: version-guard
    command: speckit.version-guard.load
    enabled: true
    optional: false
    description: Load version guard constraints into context before code generation
    condition: null
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: false
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: false
    description: Refresh agent context after planning
    condition: null
  after_tasks:
  - extension: superb
    command: speckit.superb.review
    enabled: true
    optional: false
    description: 'Catches missing or under-specified tasks at planning time. Produces
      a requirement coverage and TDD-readiness report. Bridge-native logic.

      '
    condition: null
  after_implement:
  - extension: version-guard
    command: speckit.version-guard.validate
    enabled: true
    optional: false
    description: Scan generated code for version-incompatible API patterns
    condition: null
  - extension: superb
    command: speckit.superb.verify
    enabled: true
    optional: false
    description: 'Mandatory completion gate. Bridges an installed superpowers verification-before-completion
      skill and extends it with spec-kit spec-coverage checks. Prevents false completions.

      '
    condition: null
