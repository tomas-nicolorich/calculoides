schema: spec-driven

context: |
  Project: calculoides (working tree checkout may be named differently, e.g. `calculoides-test`;
  Engram project identity is resolved from git remote `tomas-nicolorich/calculoides`).

  Tech stack:
  - Bun workspaces monorepo (`frontend`, `api`, `shared`) orchestrated with Turborepo (`turbo.json`).
  - Frontend: React 19.2, Vite 8, TypeScript 6 (strict), Tailwind CSS 4, react-router-dom 7,
    @base-ui/react, clsx/tailwind-merge. Tests: vitest + @testing-library/react + jsdom.
  - API: Express 5, Prisma 7 ORM (`prisma/schema.prisma` ~900 lines, Postgres via `pg` +
    `@prisma/adapter-pg`), Supabase JS client, Zod 4 validation, tsx for local dev server,
    deployed as Vercel functions (`vercel.json`). Tests: vitest (needs Supabase env vars via
    `api/vitest.config.ts`).
  - Shared package: cross-workspace domain types/zod schemas, commonjs.
  - Deployment target: Vercel.

  Architecture/conventions:
  - Multi-context monorepo: `CONTEXT-MAP.md` at root indexes per-package `CONTEXT.md`
    (frontend/api/shared) — see `docs/agents/domain.md`.
  - ADRs recorded in `docs/adr/0001..0011` (design-system adoption, dashboard layout/fidelity,
    transfers parity, etc.).
  - Issue tracker: GitHub Issues on `tomas-nicolorich/calculoides` (`docs/agents/issue-tracker.md`);
    triage labels follow mattpocock/skills vocabulary (`docs/agents/triage-labels.md`).
  - Quality gates: ESLint (flat config, typescript-eslint strict+stylistic type-checked), Prettier
    (devDependency, invoked via lint-staged, no standalone script), Husky pre-commit/pre-push
    hooks, Fallow static-audit gate (`.fallowrc.json`, `unused-exports`/`unused-dependencies`=warn,
    `circular-dependencies`=error) wired into `.github/workflows/fallow.yml`. Also `claude.yml` /
    `claude-code-review.yml` GitHub Actions.
  - Root scripts: `bun run test` -> `turbo run test`, `bun run lint` -> `turbo run lint`,
    `bun run typecheck` -> `turbo run typecheck`.

  Testing:
  - Test runner: vitest in both `api` and `frontend` workspaces.
  - No E2E test tooling detected (no Playwright/Cypress).
  - Coverage: v8 provider configured in `api/vitest.config.ts`; not explicitly configured for
    `frontend`.
  - Strict TDD: enabled (RED-GREEN-REFACTOR expected for implementation work).

rules:
  proposal:
    - Include rollback plan for risky changes
    - State which workspace(s) are affected (api, frontend, shared)

  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Group requirements by domain package (api/frontend/shared) when cross-cutting

  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Reference existing ADRs in docs/adr/ when a decision extends or supersedes one

  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Flag tasks that touch Prisma schema/migrations explicitly

  apply:
    guidelines:
      - Follow existing code patterns
      - Respect the multi-context monorepo boundaries (frontend/api/shared) documented in
        CONTEXT-MAP.md
      - Do not bypass Husky pre-commit/pre-push hooks or the Fallow gate
    tdd: true
    test_command: "bun run test"

  verify:
    test_command: "bun run test"
    build_command: "bun run typecheck"
    coverage_threshold: 0

  archive:
    - Warn before merging destructive deltas
