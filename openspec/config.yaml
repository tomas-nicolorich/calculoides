schema: spec-driven

context: |
  Project: calculoides (working tree checkout may be named differently, e.g. `calculoides-test`;
  Engram project identity is resolved from git remote `tomas-nicolorich/calculoides`).

  Tech stack:
  - Next.js 16 (App Router, root `app/` + `lib/`), React 19, TypeScript (strict), Tailwind CSS 4.
  - Prisma 7 ORM (`prisma/schema.prisma`) + Supabase Postgres via PgBouncer, `@supabase/ssr` for
    auth/session handling, TanStack Query for client data fetching, Zod validation, Resend for
    transactional email.
  - Package manager: bun, with a `shared` bun workspace (cross-context domain types/zod schemas)
    built via Turborepo (`turbo.json`).
  - `frontend/` (old Vite SPA) and `api/` (old Express API) are retired from the pre-Next.js
    monorepo — not deployed, not part of the active codebase.
  - Deployment target: Vercel.

  Architecture/conventions:
  - Domain glossary at `shared/CONTEXT.md` (Groups, Budget Categories, Quotas, Transfers, Savings
    Goals, Archive/Settlement) — read before touching domain logic.
  - No `@/*` path alias inside `app/` or `lib/` — use relative imports (the Fallow dead-code
    resolver doesn't follow TS path mapping).
  - Issue tracker: GitHub Issues on `tomas-nicolorich/calculoides`.
  - Quality gates: ESLint (flat config, typescript-eslint strict+stylistic type-checked), Prettier
    (devDependency, invoked via lint-staged, no standalone script), Husky pre-commit/pre-push
    hooks, Fallow static-audit gate (`.fallowrc.json`, `unused-exports`/`unused-dependencies`=warn,
    `circular-dependencies`=error) wired into `.github/workflows/fallow.yml`. Also `claude.yml` /
    `claude-code-review.yml` GitHub Actions.
  - Root scripts: `bun run test` -> vitest + `turbo run test`, `bun run lint` -> eslint +
    `turbo run lint`, `bun run typecheck` -> tsc + `turbo run typecheck`.

  Testing:
  - Unit tests: vitest at root (`app/**`, `lib/**`, `shared/**`, `proxy.ts`) plus `turbo run test`
    for the `shared` workspace.
  - E2E: Playwright (`bun run test:e2e:next`, `playwright.config.ts`).
  - Strict TDD: enabled (RED-GREEN-REFACTOR expected for implementation work).

rules:
  proposal:
    - Include rollback plan for risky changes
    - State which areas are affected (app, lib, shared, prisma)

  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Group requirements by domain concept (Groups, Categories, Quotas, Transfers, Savings,
      Archive/Settlement) when cross-cutting

  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale

  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Flag tasks that touch Prisma schema/migrations explicitly

  apply:
    guidelines:
      - Follow existing code patterns
      - Read `shared/CONTEXT.md` before touching domain logic
      - Do not bypass Husky pre-commit/pre-push hooks or the Fallow gate
    tdd: true
    test_command: "bun run test"

  verify:
    test_command: "bun run test"
    build_command: "bun run typecheck"
    coverage_threshold: 0

  archive:
    - Warn before merging destructive deltas
