name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Test and build only run on PRs — pushes get fast feedback (lint +
      # typecheck) on every branch, the full suite gates the merge instead.
      - name: Test
        if: github.event_name == 'pull_request'
        run: bun run test

      - name: Build
        if: github.event_name == 'pull_request'
        run: bun run build
