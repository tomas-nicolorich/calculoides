name: Fallow

on:
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  audit:
    name: Audit changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Run fallow audit
        id: fallow
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          format: sarif
          fail-on-issues: 'true'
          comment: 'true'

      - name: Merge SARIF runs
        if: always() && steps.fallow.outputs.sarif != ''
        run: |
          jq 'if (.runs | length) <= 1 then . else .runs = [{"tool": .runs[0].tool, "results": ([.runs[].results // []] | add // [])}] end' \
            "${{ steps.fallow.outputs.sarif }}" > merged-fallow.sarif

      - name: Upload SARIF
        if: always() && steps.fallow.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged-fallow.sarif
          category: fallow-audit

  dead-code:
    name: Full dead code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Run fallow dead-code
        id: fallow
        uses: fallow-rs/fallow@v3
        with:
          command: dead-code
          format: sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.fallow.outputs.sarif }}
          category: fallow-dead-code
